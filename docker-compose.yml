# Local full stack. Copy .env.example to .env and adjust optional settings if needed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ctf_maze
      POSTGRES_USER: ctf_maze
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_maze -d ctf_maze"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://ctf_maze:local-development-only@postgres:5432/ctf_maze
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
